<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col">
    <a href="../index.html" class="fixed top-3 left-3 z-50 text-sm text-slate-400 hover:text-white bg-slate-900/90 px-3 py-1.5 rounded-lg border border-slate-700 transition-colors no-underline">← Exercícios PDS I</a>

    <script>
        const slides = [
            {
                type: 'cover',
                title: 'Vetores unidimensionais',
                subtitle: 'histórias de engenharia com vetores: sensores fictícios, buscas humildes, matemática milenar — e um game show lendário.',
                author: 'Prof. Paulo Rezeck',
                semester: '2026/01'
            },
            {
                type: 'problem',
                id: 1,
                title: '1. Análise de dados de sensores (máx. / mín. / média)',
                motivation: 'Imagine monitorar a temperatura em um servidor: você precisa do pico de calor para evitar estrago no hardware, da leitura mais baixa quando a carga despenca à noite, e da média para fechar relatório de SLA. Nos exercícios muitas vezes não há arquivo nem API — então tratamos esse painel como se alguém tivesse colado N sensores reais gravando valores em arquivo, só que você fabrica cada amostragem com aleatoriedade bem distribuída em uma faixa plausível, como laboratório de simulação.',
                definition: 'Monte um vetor com N leituras reais geradas aleatoriamente dentro de uma faixa de temperatura crível (tipo salinha de servidor: pense algo entre “ar fresco” e “assando brownie dentro do gabinete”). Faça uma passada inteira pelo vetor e devolva o maior, o menor e a média aritmética. Escreva nessa ordem, com duas casas decimais:\nMAX: …\nMIN: …\nMEDIA: …',
                icon: '🌡️'
            },
            {
                type: 'solution',
                id: 1,
                title: 'Solução: vetor aleatório e um laço para métricas',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main() {
    int n;
    printf("Digite N: ");
    scanf("%d", &n);

    srand((unsigned int)time(NULL));

    double v[1000];
    double lo = 20.0, hi = 35.0;
    for (int i = 0; i < n; i++) {
        v[i] = lo + (hi - lo) * (rand() / (double)RAND_MAX);
    }

    double max = v[0], min = v[0], soma = 0.0;
    for (int i = 0; i < n; i++) {
        if (v[i] > max) max = v[i];
        if (v[i] < min) min = v[i];
        soma += v[i];
    }

    printf("MAX: %.2f\\n", max);
    printf("MIN: %.2f\\n", min);
    printf("MEDIA: %.2f\\n", soma / n);
    return 0;
}`,
                output: `N=600 (valores diferentes a cada execução)

As três métricas refletem a faixa fictícia de temperatura combinada.`,
            },
            {
                type: 'problem',
                id: 2,
                title: '2. Busca em “banco de dados” de IDs',
                motivation: 'Encontrar uma informação específica dentro de uma enxurrada parece coisa só de servidor — mas muda pouco quando no embarcado você varre vetor inteiro até achar o código que acende diodo de erro. Como não tem “banco de dados” verdadeiro no laboratório, montamos lista aleatória de IDs sintéticos e escolhemos um alvo qualquer: o hábito de varrer até achar primeiro índice (ou fracassar com honra devolvendo -1) permanece igual.',
                definition: 'Crie uma lista com N inteiros (simulando registros aleatórios) e gere também um alvo inteiro aleatório. Percorra do começo até o fim: se aparecer igual ao alvo, informe ENCONTRADO: seguido do índice que achou primeiro; caso termine sem sucesso devolva ENCONTRADO: -1.',
                icon: '🔎'
            },
            {
                type: 'solution',
                id: 2,
                title: 'Solução: lista aleatória e busca pelo índice',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int buscar(int vet[], int tam, int alvo) {
    for (int i = 0; i < tam; i++) {
        if (vet[i] == alvo) return i;
    }
    return -1;
}

int main() {
    int n;
    scanf("%d", &n);

    srand((unsigned int)time(NULL));

    int v[1000];
    for (int i = 0; i < n; i++) {
        v[i] = rand() % 1000;
    }

    int alvo = rand() % 1000;

    int idx = buscar(v, n, alvo);
    printf("ENCONTRADO: %d\\n", idx);
    return 0;
}`,
                output: `N=500

Rodada 1: ENCONTRADO: 417
Rodada 2: ENCONTRADO: -1
(varia com tempo e valores aleatórios)`
            },
            {
                type: 'problem',
                id: 3,
                title: '3. Crivo de Eratóstenes (primos)',
                motivation: 'Números primos aparecem no fundamento da criptografia moderna — por exemplo quando chaves bem grandes precisam de candidatos “limpos” antes das provas rápidas. O Crivo de Eratóstenes já era velho dois mil anos atrás mas ainda ensina bem o truque: um vetor de marcações vai riscando múltiplos até sobrarem só sobreviventes. No exercício fazemos igual laboratório de medidas: primeiro sorteamos até qual teto vai a varredura, como se dois times de projeto pedissem relatórios com limites diferentes.',
                definition: 'Use um vetor de flags como booleanos 0 ou 1: inicialmente marque todos como candidatos, depois elimine múltiplos progressivamente até sobrarem só marcados verdadeiros. Zero e um nunca são primos úteis nesse relatório.\nSorteie aleatoriamente o limite N num intervalo coerente (por exemplo algo entre centenas e poucos mil), mostre esse limite primeiro numa linha no estilo “LIMITE: …”. Em seguida imprima todos os primos até N em ordem crescente separados só por espaços e feche a linha ao terminar.',
                icon: '🧮'
            },
            {
                type: 'solution',
                id: 3,
                title: 'Solução: limite aleatório e vetor de marcação',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main() {
    srand((unsigned int)time(NULL));
    int n = 120 + rand() % (500 - 120 + 1);
    printf("LIMITE: %d\\n", n);

    int primo[n + 1];
    for (int i = 0; i <= n; i++) primo[i] = 1;
    primo[0] = primo[1] = 0;

    for (int p = 2; p * p <= n; p++) {
        if (primo[p] == 1) {
            for (int i = p * p; i <= n; i += p) {
                primo[i] = 0;
            }
        }
    }

    int primeiro = 1;
    for (int i = 2; i <= n; i++) {
        if (primo[i]) {
            if (!primeiro) printf(" ");
            printf("%d", i);
            primeiro = 0;
        }
    }
    printf("\\n");
    return 0;
}`,
                output: `LIMITE: 347

2 3 5 7 … 347
(Limite muda conforme cada execução)`
            },
            {
                type: 'problem',
                id: 4,
                title: '4. Ordenação de dados (bubble sort)',
                motivation: 'Dados ordenados permitem visualizar histórias e preparar caminhos para buscas melhores adiante — e o método da bolha, apesar modesto na velocidade, mostra bem o que dois laços fazem quando cada par vizinho brigando precisa só trocar de lugar até a fila ficar comportada.',
                definition: 'Gere aleatoriamente N inteiros (inclua positivos e negativos quando quiser cenário menos monótono). Implemente ordenação por bolha: compare elementos adjacentes e troque se estiverem na ordem errada; repita até encerrar as passagens necessárias. Imprima o vetor final ordenado em uma só linha, números separados por espaço.',
                icon: '📈'
            },
            {
                type: 'solution',
                id: 4,
                title: 'Solução: vetor aleatório e ordenação bolha',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

void bubbleSort(int v[], int n) {
    for (int i = 0; i < n - 1; i++) {
        for (int j = 0; j < n - i - 1; j++) {
            if (v[j] > v[j + 1]) {
                int temp = v[j];
                v[j] = v[j + 1];
                v[j + 1] = temp;
            }
        }
    }
}

int main() {
    int n;
    scanf("%d", &n);

    srand((unsigned int)time(NULL));

    int v[5000];
    for (int i = 0; i < n; i++) {
        v[i] = (int)(rand() % 1001) - 500;
    }

    bubbleSort(v, n);

    for (int i = 0; i < n; i++) {
        if (i) printf(" ");
        printf("%d", v[i]);
    }
    printf("\\n");
    return 0;
}`,
                output: `N=12 (exemplo típico, ordem nova a cada rodada)

-412 -98 0 12 203 445 … (já ordenado de ponta a ponta)`
            },
            {
                type: 'problem',
                id: 5,
                title: '5. Paradoxo de Monty Hall (simulação)',
                motivation: 'Três portas, um carro atrás só de uma delas — e a intuição humana quase sempre erra a conta depois que o apresentador abre uma porta vazia. Em engenharia resolvemos com simulação: repetir o jogo milhares de vezes com sorteios honestos e medir frequência de vitória. Esse jeito de “brincar até estatística falar alto” aparece quando precisamos validar modelos probabilísticos sem ficar apenas no quadro-branco.',
                definition: 'Simule dez mil rodadas (ou outro número grande na mesma ordem) do jogo das três portas: em cada uma o prêmio esconde uniformemente atrás de uma porta, o jogador escolhe uniformemente outra, o apresentador sempre revela uma porta ruim que não era a escolhida.\nCompare empiricamente a taxa de vitória de quem troca de porta depois da revelação versus quem teimosamente segura a primeira escolha. Imprima ambas em porcentagem com duas casas decimais.',
                icon: '🚪'
            },
            {
                type: 'solution',
                id: 5,
                title: 'Solução: vetor de 3 posições e contagem empírica',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main() {
    int tentativas = 10000;
    int vitTroca = 0;
    int vitManter = 0;

    srand((unsigned int)time(NULL));

    for (int r = 0; r < tentativas; r++) {
        int portas[3] = {0, 0, 0};
        portas[rand() % 3] = 1;

        int escolha = rand() % 3;

        /* Sempre mantém escolha */
        if (portas[escolha]) vitManter++;

        /* Sempre troca para a outra fechada: ganha sse na escolha inicial era cabra */
        if (portas[escolha] == 0) vitTroca++;
    }

    printf("Prob. trocar  : %.2f%%\\n", 100.0 * vitTroca / tentativas);
    printf("Prob. manter : %.2f%%\\n", 100.0 * vitManter / tentativas);
    return 0;
}`,
                output: `Valores próximos (variam a cada execução):

Prob. trocar  : ~66.XX%
Prob. manter : ~33.XX%`
            },
            {
                type: 'cover',
                title: 'Fim da Aula 12',
                subtitle: 'Vetores e for aparecem juntos desde a Aula 10 — consolidem índices, limites entre 0 e N−1, e sempre inicializar o aleatório antes de preencher o vetor.',
                author: 'Bons estudos!',
                semester: 'PDS I - UFMG'
            }
        ];

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        let currentIndex = 0;
        const container = document.getElementById('slide-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currIdxSpan = document.getElementById('current-index');
        const totalSlidesSpan = document.getElementById('total-slides');

        function renderSlide() {
            const slide = slides[currentIndex];
            let html = '';

            container.classList.remove('slide-enter');
            void container.offsetWidth;
            container.classList.add('slide-enter');

            if (slide.type === 'cover') {
                const iconEmoji = slide.title.includes('Vetores') ? '📚' : '✅';
                html = `
                    <div class="flex flex-col items-center justify-center h-full text-center p-8 space-y-6">
                        <div class="bg-blue-600/20 p-8 rounded-full text-6xl">${iconEmoji}</div>
                        <h1 class="text-5xl font-bold text-white tracking-tight">${slide.title}</h1>
                        <p class="text-2xl text-blue-400">${slide.subtitle}</p>
                        <div class="pt-12 border-t border-slate-700 w-1/2">
                            <p class="text-slate-400 uppercase tracking-widest text-sm">DCC - UFMG | ${slide.semester}</p>
                            <p class="text-slate-200 text-lg font-semibold">${slide.author}</p>
                        </div>
                    </div>
                `;
            } else if (slide.type === 'problem') {
                const motiv = slide.motivation != null ? slide.motivation : slide.context || '';
                const defn = slide.definition != null ? slide.definition : slide.problem || '';
                html = `
                    <div class="flex flex-col h-full px-8 pt-8 pb-6 md:pb-10 min-h-0">
                        <div class="flex items-center gap-4 border-b border-slate-700 pb-4 shrink-0">
                            <div class="p-3 bg-slate-800 rounded-lg text-3xl">${slide.icon}</div>
                            <h2 class="text-2xl md:text-3xl font-bold text-white leading-tight">${slide.title}</h2>
                        </div>
                        <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-2 gap-5 mt-6 overflow-auto">
                            <div class="rounded-xl border-l-[5px] border-blue-500 bg-blue-950/35 p-5 md:p-6 shadow-inner">
                                <h3 class="text-blue-300 font-bold text-sm uppercase mb-3 tracking-widest">Motivação</h3>
                                <p class="text-slate-100 text-[15px] md:text-base leading-relaxed">${motiv.replace(/\n/g, '<br>')}</p>
                            </div>
                            <div class="rounded-xl border-l-[5px] border-amber-500 bg-amber-950/25 p-5 md:p-6 shadow-inner">
                                <h3 class="text-amber-200 font-bold text-sm uppercase mb-3 tracking-widest">Definição</h3>
                                <p class="text-amber-50/95 text-[15px] md:text-[17px] font-medium leading-relaxed">${defn.replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (slide.type === 'solution') {
                html = `
                    <div class="flex flex-col h-full p-10 space-y-4">
                        <div class="flex items-center space-x-4 border-b border-slate-700 pb-4">
                            <div class="p-3 bg-green-900/30 rounded-lg text-2xl">✅</div>
                            <h2 class="text-3xl font-bold text-white">${slide.title}</h2>
                        </div>
                        <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-4 overflow-hidden">
                            <div class="md:col-span-2 flex flex-col rounded-xl border border-slate-700 bg-[#1e1e1e] overflow-hidden">
                                <div class="px-4 py-2 bg-slate-800 text-xs text-slate-400 font-mono flex justify-between">
                                    <span>exercicio.c</span>
                                    <span>UTF-8</span>
                                </div>
                                <pre class="p-4 text-sm code-font text-slate-300 overflow-auto flex-1"><code>${escapeHtml(slide.code)}</code></pre>
                            </div>
                            <div class="bg-slate-950 rounded-xl border border-slate-800 p-4 flex flex-col">
                                <h3 class="text-green-500 font-bold text-xs uppercase mb-3 tracking-widest">Exemplo de saída</h3>
                                <pre class="text-xs code-font text-green-400 leading-relaxed whitespace-pre-wrap">${escapeHtml(slide.output)}</pre>
                                <div class="mt-auto pt-4 border-t border-slate-800">
                                    <p class="text-[10px] text-slate-500 uppercase">Dica: teste N=1 e listas grandes; repetir execuções com aleatório muda médias e se o alvo foi achado ou não.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            currIdxSpan.innerText = currentIndex + 1;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;
        }

        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderSlide(); } });
        nextBtn.addEventListener('click', () => { if (currentIndex < slides.length - 1) { currentIndex++; renderSlide(); } });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        totalSlidesSpan.innerText = slides.length;
        renderSlide();
    </script>
</body>
</html>
