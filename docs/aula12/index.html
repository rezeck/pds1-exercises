<!DOCTYPE html>

<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col">
    <a href="../index.html" class="fixed top-3 left-3 z-50 text-sm text-slate-400 hover:text-white bg-slate-900/90 px-3 py-1.5 rounded-lg border border-slate-700 transition-colors no-underline">← Exercícios PDS I</a>

    <main class="flex-1 flex items-center justify-center p-4 md:p-8">

    <footer class="bg-slate-900/80 backdrop-blur-md border-t border-slate-800 p-6 flex items-center justify-between">
        <div class="text-slate-400 text-sm font-medium">
            Slide <span id="current-index" class="text-white">1</span> de <span id="total-slides">0</span>
        </div>
        <div class="flex space-x-4">
            <button id="prev-btn" class="flex items-center px-4 py-2 rounded-xl bg-slate-800 text-white disabled:opacity-30 hover:bg-slate-700 transition-all active:scale-95">
                ← Anterior
            </button>
            <button id="next-btn" class="flex items-center px-6 py-2 rounded-xl bg-blue-600 text-white disabled:opacity-30 hover:bg-blue-500 shadow-lg shadow-blue-900/20 transition-all active:scale-95">
                Próximo →
            </button>
        </div>
        <div class="hidden md:block">
            <span class="text-slate-500 font-bold tracking-tighter text-xl">DCC | UFMG</span>
        </div>

    <script>
        const slides = [
            {
                type: 'cover',
                title: 'Vetores unidimensionais',
                subtitle: 'percurso por índice, preenchimento com rand/srand, buscas, flags e ordenação elementar',
                author: 'Prof. Paulo Rezeck',
                semester: '2026/01'
            },
            {
                type: 'problem',
                id: 1,
                title: '1. Medições em vetor (máximo, mínimo e média)',
                context: 'Às vezes não temos arquivo nem teclado com todos os valores: simulamos amostras com rand() num intervalo escalado por RAND_MAX. A semente (srand) define a sequência; time(NULL) muda em cada execução.',
                problem: 'Leia um inteiro N (N ≥ 1, use N razoável p.ex. N ≤ 1000 para vetor na pilha). Inclua `<stdlib.h>` e `<time.h>`. Antes do preenchimento do vetor, chame `srand((unsigned int)time(NULL))`. Em seguida, preencha N posições com `double` pseudoaleatórios no intervalo [20.0, 35.0] usando apenas `rand()` e normalização por `(double)RAND_MAX`. Em um segundo percurso, calcule maior, menor e média. Imprima com duas casas nesta ordem:\nMAX: …\nMIN: …\nMEDIA: …',
                icon: '🌡️'
            },
            {
                type: 'solution',
                id: 1,
                title: 'Solução: srand preenche o vetor; um laço tira métricas',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main() {
    int n;
    printf("Digite N: ");
    scanf("%d", &n);

    srand((unsigned int)time(NULL));

    double v[1000];
    double lo = 20.0, hi = 35.0;
    for (int i = 0; i < n; i++) {
        v[i] = lo + (hi - lo) * (rand() / (double)RAND_MAX);
    }

    double max = v[0], min = v[0], soma = 0.0;
    for (int i = 0; i < n; i++) {
        if (v[i] > max) max = v[i];
        if (v[i] < min) min = v[i];
        soma += v[i];
    }

    printf("MAX: %.2f\\n", max);
    printf("MIN: %.2f\\n", min);
    printf("MEDIA: %.2f\\n", soma / n);
    return 0;
}`,
                output: `N=5000 (saídas variam a cada execução)

MAX/MIN ficam sempre em torno do intervalo [20,35].`
            },
            {
                type: 'problem',
                id: 2,
                title: '2. Busca linear em vetor',
                context: 'Vetores preenchidos com rand repetem um padrão após cada semente. Busca linear só percorre: serve para dados “fabricados” em testes quanto para leituras reais.',
                problem: 'Leia só N (N ≥ 1, ex. N ≤ 1000 para o exemplo abaixo). Chame `srand((unsigned int)time(NULL))`. Preencha um vetor de inteiros de tamanho N com valores em [0, 999] usando `rand() % 1000`. Gere também um inteiro ALVO pseudoaleatorio no mesmo intervalo. Use busca linear: se aparecer primeiro no índice i, imprima `ENCONTRADO: i`, senão imprima `ENCONTRADO: -1`. (Executar várias vezes deve alternar resultado.)',
                icon: '🔎'
            },
            {
                type: 'solution',
                id: 2,
                title: 'Solução: preencher com rand; buscar com índices',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int buscar(int vet[], int tam, int alvo) {
    for (int i = 0; i < tam; i++) {
        if (vet[i] == alvo) return i;
    }
    return -1;
}

int main() {
    int n;
    scanf("%d", &n);

    srand((unsigned int)time(NULL));

    int v[1000];
    for (int i = 0; i < n; i++) {
        v[i] = rand() % 1000;
    }

    int alvo = rand() % 1000;

    int idx = buscar(v, n, alvo);
    printf("ENCONTRADO: %d\\n", idx);
    return 0;
}`,
                output: `N=500

Rodada 1: ENCONTRADO: 417
Rodada 2: ENCONTRADO: -1
(varia com tempo e valores aleatórios)`
            },
            {
                type: 'problem',
                id: 3,
                title: '3. Primos até N (crivo de Eratóstenes)',
                context: 'O crivo usa um vetor de “ainda primo?” (marcado com 1) e marca múltiplos como 0. Combina bem com laços encadeados e é base didática antes de hashing e criptografia.',
                problem: 'Em vez de digitar o limite, use `srand((unsigned int)time(NULL))` e obtenha N inteiro “aleatório” entre 120 e 500 (uniforme):\n `int n = 120 + rand() % (500 - 120 + 1);`\n Imprima em uma primeira linha o valor de N gerado (`LIMITE: N`). Lista todos os primos entre 2 e N, em ordem crescente e separados por espaço.\n Vetor auxiliar de flags: VLA `(n+1)` em C99, ou `#define MAX 100005` para ambientes estritos.',
                icon: '🧮'
            },
            {
                type: 'solution',
                id: 3,
                title: 'Solução: limite pseudoaleatorio + vetor de flags',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main() {
    srand((unsigned int)time(NULL));
    int n = 120 + rand() % (500 - 120 + 1);
    printf("LIMITE: %d\\n", n);

    int primo[n + 1];
    for (int i = 0; i <= n; i++) primo[i] = 1;
    primo[0] = primo[1] = 0;

    for (int p = 2; p * p <= n; p++) {
        if (primo[p] == 1) {
            for (int i = p * p; i <= n; i += p) {
                primo[i] = 0;
            }
        }
    }

    int primeiro = 1;
    for (int i = 2; i <= n; i++) {
        if (primo[i]) {
            if (!primeiro) printf(" ");
            printf("%d", i);
            primeiro = 0;
        }
    }
    printf("\\n");
    return 0;
}`,
                output: `LIMITE: 347

2 3 5 7 … 347
(Limite muda conforme cada execução)`
            },
            {
                type: 'problem',
                id: 4,
                title: '4. Ordenação por bolha (bubble sort)',
                context: 'Trocas entre vizinhos que “elevam” o maior elemento para o fim a cada passada — intuitivo sobre vetores, prepara mergesort/quicksort em cursos seguintes.',
                problem: 'Leia só N (1 ≤ N ≤ 5000 para caber na pilha conforme exemplo). Com `srand((unsigned int)time(NULL))`, preencha o vetor com N inteiros em [−500, 500]: use `(int)((rand() % 1001) - 500)`. Ordene por bubble sort (troque quando `v[j] > v[j+1]`). Imprima a sequência ordenada numa única linha, números separados por espaço.',
                icon: '📈'
            },
            {
                type: 'solution',
                id: 4,
                title: 'Solução: gerar valores, bubble sort e impressão',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

void bubbleSort(int v[], int n) {
    for (int i = 0; i < n - 1; i++) {
        for (int j = 0; j < n - i - 1; j++) {
            if (v[j] > v[j + 1]) {
                int temp = v[j];
                v[j] = v[j + 1];
                v[j + 1] = temp;
            }
        }
    }
}

int main() {
    int n;
    scanf("%d", &n);

    srand((unsigned int)time(NULL));

    int v[5000];
    for (int i = 0; i < n; i++) {
        v[i] = (int)(rand() % 1001) - 500;
    }

    bubbleSort(v, n);

    for (int i = 0; i < n; i++) {
        if (i) printf(" ");
        printf("%d", v[i]);
    }
    printf("\\n");
    return 0;
}`,
                output: `N=12 (exemplo típico, ordem nova a cada rodada)

-412 -98 0 12 203 445 … (já ordenado de ponta a ponta)`
            },
            {
                type: 'problem',
                id: 5,
                title: '5. Simulação probabilística (paradoxo de Monty Hall)',
                context: 'Métodos de Monte Carlo repetem experimentos aleatórios e estimam probabilidades pela frequência. Aqui uma porta esconde o “prêmio” e estudamos estratégia de trocar ou manter.',
                problem: 'Simule repetidamente este jogo: entre 3 portas, apenas uma vale 1 (“carro”), as outras 0. Escolha uniforme sua porta inicial. O apresentador revela sempre uma porta com cabra (0) diferente da sua. Você sempre troca para a outra porta fechada. Fixe rodadas R = 10 000, use rand() já com seed em time(NULL). Calcule fração de vitórias dessa política sempre-trocando e imprima em porcentagem com duas casas (ex.: “Prob. trocar: 66.71%”). Opcionalmente imprima segundo valor para “sempre manter”.',
                icon: '🚪'
            },
            {
                type: 'solution',
                id: 5,
                title: 'Solução: vetor de 3 posições e contagem empírica',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main() {
    int tentativas = 10000;
    int vitTroca = 0;
    int vitManter = 0;

    srand((unsigned int)time(NULL));

    for (int r = 0; r < tentativas; r++) {
        int portas[3] = {0, 0, 0};
        portas[rand() % 3] = 1;

        int escolha = rand() % 3;

        /* Sempre mantém escolha */
        if (portas[escolha]) vitManter++;

        /* Sempre troca para a outra fechada: ganha sse na escolha inicial era cabra */
        if (portas[escolha] == 0) vitTroca++;
    }

    printf("Prob. trocar  : %.2f%%\\n", 100.0 * vitTroca / tentativas);
    printf("Prob. manter : %.2f%%\\n", 100.0 * vitManter / tentativas);
    return 0;
}`,
                output: `Valores próximos (variam a cada execução):

Prob. trocar  : ~66.XX%
Prob. manter : ~33.XX%`
            },
            {
                type: 'cover',
                title: 'Fim da Aula 12',
                subtitle: 'Vetores e for aparecem juntos desde Aula 10 — consolidem índices, srand antes de montar dados e repetibilidade só com mesma seed.',
                author: 'Bons estudos!',
                semester: 'PDS I - UFMG'
            }
        ];

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        let currentIndex = 0;
        const container = document.getElementById('slide-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currIdxSpan = document.getElementById('current-index');
        const totalSlidesSpan = document.getElementById('total-slides');

        function renderSlide() {
            const slide = slides[currentIndex];
            let html = '';

            container.classList.remove('slide-enter');
            void container.offsetWidth;
            container.classList.add('slide-enter');

            if (slide.type === 'cover') {
                const iconEmoji = slide.title.includes('Vetores') ? '📚' : '✅';
                html = `
                    <div class="flex flex-col items-center justify-center h-full text-center p-8 space-y-6">
                        <div class="bg-blue-600/20 p-8 rounded-full text-6xl">${iconEmoji}</div>
                        <h1 class="text-5xl font-bold text-white tracking-tight">${slide.title}</h1>
                        <p class="text-2xl text-blue-400">${slide.subtitle}</p>
                        <div class="pt-12 border-t border-slate-700 w-1/2">
                            <p class="text-slate-400 uppercase tracking-widest text-sm">DCC - UFMG | ${slide.semester}</p>
                            <p class="text-slate-200 text-lg font-semibold">${slide.author}</p>
                        </div>
                    </div>
                `;
            } else if (slide.type === 'problem') {
                html = `
                    <div class="flex flex-col h-full p-10 space-y-6">
                        <div class="flex items-center space-x-4 border-b border-slate-700 pb-4">
                            <div class="p-3 bg-slate-800 rounded-lg text-3xl">${slide.icon}</div>
                            <h2 class="text-3xl font-bold text-white">${slide.title}</h2>
                        </div>
                        <div class="flex-1 space-y-6 overflow-auto">
                            <div class="bg-slate-800/50 p-6 rounded-xl border border-slate-700">
                                <h3 class="text-blue-400 font-bold text-xs uppercase mb-2 tracking-widest">Contexto</h3>
                                <p class="text-slate-200 text-lg">${slide.context}</p>
                            </div>
                            <div class="bg-blue-900/20 p-6 rounded-xl border border-blue-500/30">
                                <h3 class="text-blue-400 font-bold text-xs uppercase mb-2 tracking-widest">Problema</h3>
                                <p class="text-white text-xl font-medium leading-relaxed">${slide.problem.replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (slide.type === 'solution') {
                html = `
                    <div class="flex flex-col h-full p-10 space-y-4">
                        <div class="flex items-center space-x-4 border-b border-slate-700 pb-4">
                            <div class="p-3 bg-green-900/30 rounded-lg text-2xl">✅</div>
                            <h2 class="text-3xl font-bold text-white">${slide.title}</h2>
                        </div>
                        <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-4 overflow-hidden">
                            <div class="md:col-span-2 flex flex-col rounded-xl border border-slate-700 bg-[#1e1e1e] overflow-hidden">
                                <div class="px-4 py-2 bg-slate-800 text-xs text-slate-400 font-mono flex justify-between">
                                    <span>exercicio.c</span>
                                    <span>UTF-8</span>
                                </div>
                                <pre class="p-4 text-sm code-font text-slate-300 overflow-auto flex-1"><code>${escapeHtml(slide.code)}</code></pre>
                            </div>
                            <div class="bg-slate-950 rounded-xl border border-slate-800 p-4 flex flex-col">
                                <h3 class="text-green-500 font-bold text-xs uppercase mb-3 tracking-widest">Exemplo de saída</h3>
                                <pre class="text-xs code-font text-green-400 leading-relaxed whitespace-pre-wrap">${escapeHtml(slide.output)}</pre>
                                <div class="mt-auto pt-4 border-t border-slate-800">
                                    <p class="text-[10px] text-slate-500 uppercase">Dica: N=1, use srand fixa para comparar rodadas iguais, e cheque se RAND_MAX &gt; valor do módulo no rand.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            currIdxSpan.innerText = currentIndex + 1;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;
        }

        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderSlide(); } });
        nextBtn.addEventListener('click', () => { if (currentIndex < slides.length - 1) { currentIndex++; renderSlide(); } });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        totalSlidesSpan.innerText = slides.length;
        renderSlide();
    </script>
</body>
</html>
