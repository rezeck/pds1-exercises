<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col">

    <script>
        const slides = [
            {
                type: 'cover',
                title: 'Vetores unidimensionais',
                subtitle: 'percurso por índice, dados gerados aleatoriamente, buscas, flags e ordenação elementar',
                author: 'Prof. Paulo Rezeck',
                semester: '2026/01'
            },
            {
                type: 'problem',
                id: 1,
                title: '1. Medições em vetor (máximo, mínimo e média)',
                context: 'Imagine monitorar a temperatura de um servidor. Você quer o pico (máximo) para não superaquecer o equipamento, o valor mais baixo e a média para um relatório. Em laboratório, às vezes não há arquivo de dados — então simulamos N leituras escolhendo cada elemento ao acaso dentro de uma faixa plausível (por exemplo algo em torno de “sala de máquinas”).',
                problem: 'Leia um inteiro N ≥ 1. Inicialize o gerador aleatório (por exemplo uma semente tirada da hora atual, como costumamos na disciplina). Preencha um vetor com N valores reais simulados, todos aleatoriamente dentro de uma faixa de temperatura que você fixar entre cerca de 20 °C e 35 °C. Em seguida, percorrendo esse vetor, calcule e imprima o maior, o menor e a média aritmética, com duas casas decimais, nestas linhas:\nMAX: …\nMIN: …\nMEDIA: …',
                icon: '🌡️'
            },
            {
                type: 'solution',
                id: 1,
                title: 'Solução: vetor aleatório e um laço para métricas',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main() {
    int n;
    printf("Digite N: ");
    scanf("%d", &n);

    srand((unsigned int)time(NULL));

    double v[1000];
    double lo = 20.0, hi = 35.0;
    for (int i = 0; i < n; i++) {
        v[i] = lo + (hi - lo) * (rand() / (double)RAND_MAX);
    }

    double max = v[0], min = v[0], soma = 0.0;
    for (int i = 0; i < n; i++) {
        if (v[i] > max) max = v[i];
        if (v[i] < min) min = v[i];
        soma += v[i];
    }

    printf("MAX: %.2f\\n", max);
    printf("MIN: %.2f\\n", min);
    printf("MEDIA: %.2f\\n", soma / n);
    return 0;
}`,
                output: `N=600 (valores diferentes a cada execução)

As três métricas refletem a faixa fictícia de temperatura combinada.`,
            },
            {
                type: 'problem',
                id: 2,
                title: '2. Busca linear em vetor',
                context: 'Precisamos achar uma informação em meio a muitos IDs ou códigos. Em sistemas embarcados isso aparece quando se varre uma lista até achar uma falha repetida.',
                problem: 'Leia o tamanho N do vetor e preencha o vetor com N inteiros escolhidos aleatoriamente (por exemplo valores que simulem IDs em uma faixa que você mesmo definir). Escolha também um inteiro alvo ao acaso dentro da mesma ideia de faixa. Implemente uma busca linear percorrendo desde o primeiro índice: se o alvo aparecer na posição i, imprima ENCONTRADO: i; caso contrário imprima ENCONTRADO: -1.',
                icon: '🔎'
            },
            {
                type: 'solution',
                id: 2,
                title: 'Solução: lista aleatória e busca pelo índice',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int buscar(int vet[], int tam, int alvo) {
    for (int i = 0; i < tam; i++) {
        if (vet[i] == alvo) return i;
    }
    return -1;
}

int main() {
    int n;
    scanf("%d", &n);

    srand((unsigned int)time(NULL));

    int v[1000];
    for (int i = 0; i < n; i++) {
        v[i] = rand() % 1000;
    }

    int alvo = rand() % 1000;

    int idx = buscar(v, n, alvo);
    printf("ENCONTRADO: %d\\n", idx);
    return 0;
}`,
                output: `N=500

Rodada 1: ENCONTRADO: 417
Rodada 2: ENCONTRADO: -1
(varia com tempo e valores aleatórios)`
            },
            {
                type: 'problem',
                id: 3,
                title: '3. Primos até N (crivo de Eratóstenes)',
                context: 'Primos aparecem no fundamento de vários sistemas seguros — e o Crivo de Eratóstenes, apesar antigo, ainda serve para filtrar candidatos usando um vetor de marcações.',
                problem: 'Inicialize o gerador aleatório como na disciplina costuma-se fazer. Escolha um limite inteiro N ao acaso dentro de uma faixa que faça sentido para o problema (por exemplo algo entre cem e poucos mil), e mostre esse limite na saída (por exemplo uma linha LIMITE: N antes da lista).\nConstrua um vetor de flags 0 ou 1: inicialmente marcando possíveis primos e depois eliminando múltiplos; ao final imprima todos os primos entre 2 e N, em ordem crescente, separados por um espaço e com quebra de linha ao terminar.',
                icon: '🧮'
            },
            {
                type: 'solution',
                id: 3,
                title: 'Solução: limite aleatório e vetor de marcação',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main() {
    srand((unsigned int)time(NULL));
    int n = 120 + rand() % (500 - 120 + 1);
    printf("LIMITE: %d\\n", n);

    int primo[n + 1];
    for (int i = 0; i <= n; i++) primo[i] = 1;
    primo[0] = primo[1] = 0;

    for (int p = 2; p * p <= n; p++) {
        if (primo[p] == 1) {
            for (int i = p * p; i <= n; i += p) {
                primo[i] = 0;
            }
        }
    }

    int primeiro = 1;
    for (int i = 2; i <= n; i++) {
        if (primo[i]) {
            if (!primeiro) printf(" ");
            printf("%d", i);
            primeiro = 0;
        }
    }
    printf("\\n");
    return 0;
}`,
                output: `LIMITE: 347

2 3 5 7 … 347
(Limite muda conforme cada execução)`
            },
            {
                type: 'problem',
                id: 4,
                title: '4. Ordenação por bolha (bubble sort)',
                context: 'Dados ordenados facilitam análises e até buscas melhores adiante — e o método da bolha, apesar simples, mostra bem como percorrer e rearranjar índices de um vetor.',
                problem: 'Leia um N e gere um vetor com N números inteiros escolhidos aleatoriamente (faixa que você mesmo convencionar, bastando que apareçam valores positivos e negativos de vez em quando).\nImplemente ordenação por bolha: compare elementos vizinhos e troque quando estiverem fora da ordem; repita até fechar todas as passadas necessárias. Imprima o vetor ordenado em uma única linha, elementos separados por espaço.',
                icon: '📈'
            },
            {
                type: 'solution',
                id: 4,
                title: 'Solução: vetor aleatório e ordenação bolha',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

void bubbleSort(int v[], int n) {
    for (int i = 0; i < n - 1; i++) {
        for (int j = 0; j < n - i - 1; j++) {
            if (v[j] > v[j + 1]) {
                int temp = v[j];
                v[j] = v[j + 1];
                v[j + 1] = temp;
            }
        }
    }
}

int main() {
    int n;
    scanf("%d", &n);

    srand((unsigned int)time(NULL));

    int v[5000];
    for (int i = 0; i < n; i++) {
        v[i] = (int)(rand() % 1001) - 500;
    }

    bubbleSort(v, n);

    for (int i = 0; i < n; i++) {
        if (i) printf(" ");
        printf("%d", v[i]);
    }
    printf("\\n");
    return 0;
}`,
                output: `N=12 (exemplo típico, ordem nova a cada rodada)

-412 -98 0 12 203 445 … (já ordenado de ponta a ponta)`
            },
            {
                type: 'problem',
                id: 5,
                title: '5. Simulação probabilística (paradoxo de Monty Hall)',
                context: 'Simular cenários repetidas vezes e medir proporções nos dá segurança em probabilidade — método que em engenharia costuma estar ligado a estimativas Monte Carlo. Aqui estudamos estratégia de trocar ou manter porta no jogo de três portas.',
                problem: 'Simule pelo menos alguns milhares de rodadas do problema das três portas: em cada rodada apenas uma porta “vale” como prêmio; as outras não. Sorteie onde fica o prêmio e a escolha inicial do jogador de forma equiprovável entre as três. Considere a estratégia em que o jogador sempre troca para a outra porta depois da revelação (como tratamos em sala).\nCalcule empiricamente a taxa de vitória quando se troca sempre, e imprima em porcentagem com duas casas decimais. Se quiser, imprima também a taxa quando o jogador nunca troca.',
                icon: '🚪'
            },
            {
                type: 'solution',
                id: 5,
                title: 'Solução: vetor de 3 posições e contagem empírica',
                code: `#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int main() {
    int tentativas = 10000;
    int vitTroca = 0;
    int vitManter = 0;

    srand((unsigned int)time(NULL));

    for (int r = 0; r < tentativas; r++) {
        int portas[3] = {0, 0, 0};
        portas[rand() % 3] = 1;

        int escolha = rand() % 3;

        /* Sempre mantém escolha */
        if (portas[escolha]) vitManter++;

        /* Sempre troca para a outra fechada: ganha sse na escolha inicial era cabra */
        if (portas[escolha] == 0) vitTroca++;
    }

    printf("Prob. trocar  : %.2f%%\\n", 100.0 * vitTroca / tentativas);
    printf("Prob. manter : %.2f%%\\n", 100.0 * vitManter / tentativas);
    return 0;
}`,
                output: `Valores próximos (variam a cada execução):

Prob. trocar  : ~66.XX%
Prob. manter : ~33.XX%`
            },
            {
                type: 'cover',
                title: 'Fim da Aula 12',
                subtitle: 'Vetores e for aparecem juntos desde a Aula 10 — consolidem índices, limites entre 0 e N−1, e sempre inicializar o aleatório antes de preencher o vetor.',
                author: 'Bons estudos!',
                semester: 'PDS I - UFMG'
            }
        ];

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        let currentIndex = 0;
        const container = document.getElementById('slide-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currIdxSpan = document.getElementById('current-index');
        const totalSlidesSpan = document.getElementById('total-slides');

        function renderSlide() {
            const slide = slides[currentIndex];
            let html = '';

            container.classList.remove('slide-enter');
            void container.offsetWidth;
            container.classList.add('slide-enter');

            if (slide.type === 'cover') {
                const iconEmoji = slide.title.includes('Vetores') ? '📚' : '✅';
                html = `
                    <div class="flex flex-col items-center justify-center h-full text-center p-8 space-y-6">
                        <div class="bg-blue-600/20 p-8 rounded-full text-6xl">${iconEmoji}</div>
                        <h1 class="text-5xl font-bold text-white tracking-tight">${slide.title}</h1>
                        <p class="text-2xl text-blue-400">${slide.subtitle}</p>
                        <div class="pt-12 border-t border-slate-700 w-1/2">
                            <p class="text-slate-400 uppercase tracking-widest text-sm">DCC - UFMG | ${slide.semester}</p>
                            <p class="text-slate-200 text-lg font-semibold">${slide.author}</p>
                        </div>
                    </div>
                `;
            } else if (slide.type === 'problem') {
                html = `
                    <div class="flex flex-col h-full p-10 space-y-6">
                        <div class="flex items-center space-x-4 border-b border-slate-700 pb-4">
                            <div class="p-3 bg-slate-800 rounded-lg text-3xl">${slide.icon}</div>
                            <h2 class="text-3xl font-bold text-white">${slide.title}</h2>
                        </div>
                        <div class="flex-1 space-y-6 overflow-auto">
                            <div class="bg-slate-800/50 p-6 rounded-xl border border-slate-700">
                                <h3 class="text-blue-400 font-bold text-xs uppercase mb-2 tracking-widest">Contexto</h3>
                                <p class="text-slate-200 text-lg">${slide.context}</p>
                            </div>
                            <div class="bg-blue-900/20 p-6 rounded-xl border border-blue-500/30">
                                <h3 class="text-blue-400 font-bold text-xs uppercase mb-2 tracking-widest">Problema</h3>
                                <p class="text-white text-xl font-medium leading-relaxed">${slide.problem.replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (slide.type === 'solution') {
                html = `
                    <div class="flex flex-col h-full p-10 space-y-4">
                        <div class="flex items-center space-x-4 border-b border-slate-700 pb-4">
                            <div class="p-3 bg-green-900/30 rounded-lg text-2xl">✅</div>
                            <h2 class="text-3xl font-bold text-white">${slide.title}</h2>
                        </div>
                        <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-4 overflow-hidden">
                            <div class="md:col-span-2 flex flex-col rounded-xl border border-slate-700 bg-[#1e1e1e] overflow-hidden">
                                <div class="px-4 py-2 bg-slate-800 text-xs text-slate-400 font-mono flex justify-between">
                                    <span>exercicio.c</span>
                                    <span>UTF-8</span>
                                </div>
                                <pre class="p-4 text-sm code-font text-slate-300 overflow-auto flex-1"><code>${escapeHtml(slide.code)}</code></pre>
                            </div>
                            <div class="bg-slate-950 rounded-xl border border-slate-800 p-4 flex flex-col">
                                <h3 class="text-green-500 font-bold text-xs uppercase mb-3 tracking-widest">Exemplo de saída</h3>
                                <pre class="text-xs code-font text-green-400 leading-relaxed whitespace-pre-wrap">${escapeHtml(slide.output)}</pre>
                                <div class="mt-auto pt-4 border-t border-slate-800">
                                    <p class="text-[10px] text-slate-500 uppercase">Dica: teste N=1 e listas grandes; repetir execuções com aleatório muda médias e se o alvo foi achado ou não.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            currIdxSpan.innerText = currentIndex + 1;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;
        }

        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderSlide(); } });
        nextBtn.addEventListener('click', () => { if (currentIndex < slides.length - 1) { currentIndex++; renderSlide(); } });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        totalSlidesSpan.innerText = slides.length;
        renderSlide();
    </script>
</body>
